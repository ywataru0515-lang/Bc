<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.wrap{display:flex;gap:44px;align-items:flex-start}
.card{flex:1.25;background:#fff;border:3px solid #1d1a16;border-radius:10px;padding:30px 34px;box-shadow:8px 8px 0 #b8912f}
.c{display:flex;gap:22px;font-size:30px;line-height:1.5;padding:12px 0;border-bottom:1px dashed #d8ccb0}
.c b{color:#b8912f;min-width:94px}
ruby rt{font-size:15px;color:#c8102e}
.tips{flex:1}
.tip{font-size:28px;font-weight:900;margin-bottom:26px;padding-left:52px;position:relative;line-height:1.5}
.tip:before{content:"✓";position:absolute;left:0;top:-4px;width:38px;height:38px;background:#c8102e;color:#fff;border-radius:50%;text-align:center;line-height:38px;font-size:24px}
.tip small{display:block;font-size:21px;font-weight:400;color:#6b6152}
</style></head><body><div class="bar"></div><h1>暗い会場でも読める「カンペ」の形</h1><div class="sub">小さい字は、本番でほぼ見えません</div>
<div class="wrap"><div class="card">
<div class="c"><b>19:00</b><span>「皆さん、お疲れさまです！」</span></div>
<div class="c"><b>19:02</b><span>乾杯：<ruby>東海林<rt>しょうじ</rt></ruby> 部長（1分）</span></div>
<div class="c"><b>19:40</b><span>「20時からゲームします」</span></div>
<div class="c"><b>20:50</b><span>中締め：<ruby>四十物<rt>あいもの</rt></ruby> 課長</span></div>
</div><div class="tips">
<div class="tip">文字は大きく、1行1セリフ<small>A4横で28pt以上が目安</small></div>
<div class="tip">名前にふりがな<small>前日に本人か周りに読みを確認</small></div>
<div class="tip">時刻を左端に<small>押しているかが一目でわかる</small></div>
</div></div><div class="mark">DERBY MATCH</div></body></html>
