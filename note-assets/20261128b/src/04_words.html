<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
table{width:100%;border-collapse:separate;border-spacing:0 12px;font-size:26px}
th{font-size:22px;text-align:left;padding:0 22px;color:#6b6152}
td{background:#fff;padding:18px 22px;font-weight:700;border-top:2px solid #d8ccb0;border-bottom:2px solid #d8ccb0}
td:first-child{border-left:2px solid #d8ccb0;border-radius:14px 0 0 14px;color:#6b6152;text-decoration:line-through;text-decoration-color:#c8102e}
td:nth-child(2){width:60px;text-align:center;color:#b8912f}
td:last-child{border-right:2px solid #d8ccb0;border-radius:0 14px 14px 0}
</style></head><body><div class="bar"></div><h1>つい言っちゃう一言、<span class="red">こう言い換え</span></h1><div class="sub">悪気がないぶん、気づきにくいやつです</div>
<table><tr><th>ついやりがち</th><th></th><th>言い換え</th></tr>
<tr><td>「とりあえず全員、生で！」</td><td>→</td><td>「最初の1杯、ご希望ありますか？」</td></tr>
<tr><td>「え、なんで飲まないの？」</td><td>→</td><td>「次、何にする？」</td></tr>
<tr><td>「1杯くらい付き合ってよ〜」</td><td>→</td><td>（言わない。グラスの中身はその人の自由）</td></tr>
<tr><td>「二次会、全員行くよね！」</td><td>→</td><td>「行ける人だけ、入口に集合で！」</td></tr>
</table><div class="mark">DERBY MATCH</div></body></html>
