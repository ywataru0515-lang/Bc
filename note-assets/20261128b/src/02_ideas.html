<div class="cols">

<div class="c"><h2>② 乾杯〜食事中</h2><div class="t">理由を聞かない</div>
<div class="r"><div class="n">4</div>「お好きな飲み物で」乾杯</div><div class="r"><div class="n">5</div>全員そろってから乾杯</div><div class="r"><div class="n">6</div>「なんで飲まないの？」を言い換え</div><div class="r"><div class="n">7</div>今年はお酌なし宣言</div></div>

<div class="r"><div class="n">8</div>お酒と関係ないチーム戦</div><div class="r"><div class="n">9</div>二次会は「行ける人だけ」</div><div class="r"><div class="n">10</div>アンケートで声を拾う</div></div>
