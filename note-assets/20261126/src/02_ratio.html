<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.wrap{display:flex;gap:28px;margin-top:8px}
.box{flex:1;border-radius:18px;padding:30px 28px;color:#1d1a16;background:#fff;border:3px solid #d8ccb0}
.box .p{font-size:84px;font-weight:900;line-height:1}
.box .n{font-size:32px;font-weight:900;margin:14px 0 10px}
.box .d{font-size:23px;color:#4a4236;line-height:1.55}
.b1{border-color:#c8102e}.b1 .p{color:#c8102e}
.b2{border-color:#b8912f}.b2 .p{color:#b8912f}
.b3 .p{color:#6b6152}
.note{margin-top:30px;font-size:24px;background:#f3e6c4;padding:16px 24px;border-radius:12px}
</style></head><body><div class="bar"></div><h1>景品予算は「3：4：3」に分けるだけ</h1><div class="sub">先に箱を決めると、通販サイトで3時間迷わなくなります</div>
<div class="wrap">
<div class="box b1"><div class="p">3割</div><div class="n">1等・特賞</div><div class="d">使い道が自由な券がいちばん喜ばれる<br>（食事券・商品券など）</div></div>
<div class="box b2"><div class="p">4割</div><div class="n">中間の賞（2〜5等）</div><div class="d">見て笑える物・<br>テーブルに並べて映える物</div></div>
<div class="box b3"><div class="p">3割</div><div class="n">参加賞・ブービー賞</div><div class="d">全員に小さく。<br>手ぶらで帰る人ゼロが目標</div></div>
</div>
<div class="note">景品の数は参加者の<b>2〜3割</b>が目安。参加賞は別枠で全員に。</div>
<div class="mark">DERBY MATCH</div></body></html>
